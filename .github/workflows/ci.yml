name: CI

# Thin stub — the gate and steps live in chrischall/workflows.
# Status-mode gate: un-armed PRs are blocked by a yellow `ci-gated: pending`
# commit status (not a red failing job); the repo ruleset must require the
# `ci-gated` status context (scripts/update-ruleset.sh flips it from `ci / ci`).
# The permissions block is load-bearing: the reusable workflow posts the
# `ci-gated` status with this token, and (a) callers pass read-only by default,
# (b) dependabot-triggered runs are read-only unless permissions are explicit.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  statuses: write

jobs:
  ci:
    uses: chrischall/workflows/.github/workflows/reusable-mcp-ci.yml@main
    with:
      node-version: "26"
      build-command: npm run build
      # Coverage, not bare `npm test`: vitest.config.ts sets 100% thresholds and
      # only `test:coverage` enforces them. `npm test` stays coverage-free for
      # fast local iteration. `worker:test` is a SEPARATE pool (workerd via
      # Miniflare) covering src/worker.ts and the hosted connector — the Node run
      # cannot load those files at all, so skipping it would leave the whole
      # connector untested in CI.
      test-command: npm run test:coverage && npm run worker:typecheck && npm run worker:test
      gate-mode: status
